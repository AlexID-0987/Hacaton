
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>AI Product Assistant</title>

    <link rel="stylesheet" href="/css/index.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="topbar">
        <div class="topbar-inner">

            <a href="/" class="brand">
                <img class="brand-logo"
                     src="https://allretail.ua/static/files/originals/2/0c/81ef94822fc56477bd777a767f47e0c2.svg"
                     alt="Сільпо">
            </a>

            <div class="header-actions">

                <span class="app-title">
                    AI помічник для покупок
                </span>

                <button id="loginBtn"
                        class="btn btn-primary"
                        type="button">
                    Увійти через Silpo
                </button>

            </div>

        </div>
    </header>


    <!-- ================= MAIN ================= -->

    <main class="page">

        <!-- ================= HERO ================= -->

        <section class="hero">

            <div class="hero-content">

                <span class="promo-badge-hero">
                    Найкраща комбінація
                </span>

                <h1>
                    Підібери продукти
                    для сніданку
                    до 350 грн
                </h1>

            </div>

        </section>


        <!-- ================= QUICK SELECTION ================= -->

        <section class="quick-selection">

            <!-- FRUITS -->

            <article class="promo-card secondary">

                <span class="promo-badge">
                    Свіжі
                </span>

                <h3>
                    Фрукти
                </h3>

                <label for="fruitSelect">
                    Оберіть фрукт
                </label>

                <select id="fruitSelect">
                    <option value="">
                        Оберіть фрукти
                    </option>
                </select>

                <div id="fruitList"
                     class="mini-product-list">
                </div>

            </article>


            <!-- VEGETABLES -->

            <article class="promo-card tertiary">

                <span class="promo-badge">
                    Натуральні
                </span>

                <h3>
                    Овочі
                </h3>

                <label for="vegetableSelect">
                    Оберіть овоч
                </label>

                <select id="vegetableSelect">
                    <option value="">
                        Оберіть овочі
                    </option>
                </select>

                <div id="vegetableList"
                     class="mini-product-list">
                </div>

            </article>

        </section>


        <!-- ================= FILTERS ================= -->

        <section class="filter-panel">

            <div class="filter">

                <label for="categoryFilter">
                    Категорія
                </label>

                <div class="select-wrap">

                    <select id="categoryFilter">

                        <option value="all">
                            Усі товари
                        </option>

                        <option value="Фрукти">
                            Фрукти
                        </option>

                        <option value="Овочі">
                            Овочі
                        </option>

                        <option value="Молочні">
                            Молочні
                        </option>

                        <option value="М'ясо">
                            М'ясо
                        </option>

                        <option value="Хлібобулочні">
                            Хлібобулочні
                        </option>

                        <option value="Напої">
                            Напої
                        </option>

                        <option value="Риба">
                            Риба
                        </option>

                    </select>

                </div>

            </div>


            <div class="filter">

                <label for="mealFilter">
                    Тип прийому їжі
                </label>

                <div class="select-wrap">

                    <select id="mealFilter">

                        <option value="all">
                            Усі
                        </option>

                        <option value="сніданок">
                            Сніданок
                        </option>

                        <option value="обід">
                            Обід
                        </option>

                        <option value="вечеря">
                            Вечеря
                        </option>

                        <option value="пікнік">
                            Пікнік
                        </option>

                    </select>

                </div>

            </div>

        </section>


        <!-- ================= AI ASSISTANT ================= -->

        <section class="assistant-box">

            <div class="assistant-header">

                <div>
                    <h2>
                        AI помічник
                    </h2>

                    <p>
                        Напишіть, що ви хочете купити
                    </p>
                </div>

                <span class="chip">
                    Онлайн
                </span>

            </div>


            <div class="input-wrap">

                <textarea id="message"
                          aria-label="Запит до AI"
                          placeholder="Наприклад: підбери продукти для сніданку до 350 грн">Підбери продукти для сніданку до 350 грн</textarea>

                <button id="sendBtn"
                        class="send-btn"
                        type="button">

                    Запитати

                </button>

            </div>


            <!-- AI RESULT -->

            <div id="resultBox"
                 class="result-box"
                 aria-live="polite">

                
            </div>
            
            <div class="delivery-box" id="deliveryBox" style="display:none;">

                <div class="delivery-header">
                    <h3>🚚 Доставка Silpo</h3>
                    <span class="chip">MCP</span>
                </div>

                <div class="delivery-address">

                    <label for="deliveryAddress">
                        Адреса доставки
                    </label>

                    <div class="address-row">

                        <input id="deliveryAddress"
                               type="text"
                               placeholder="Наприклад: Київ, вул. Хрещатик, 1" />

                        <button id="findAddressBtn"
                                class="send-btn"
                                type="button">
                            Знайти адресу
                        </button>

                    </div>

                </div>

                <div id="deliveryStatus" class="meta"></div>

                <div id="deliveryOptions"></div>

                <div id="timeSlotsBox"
                     style="display:none; margin-top:20px;">

                    <h4>⏰ Доступний час доставки</h4>

                    <div id="timeSlots"></div>

                </div>

            </div>
            

        </section>


        <!-- ================= PRODUCTS ================= -->

        <section class="products-section">

            <div class="section-header">

                <div>
                    <h2>
                        Товари
                    </h2>

                    <p id="productsDescription">
                        Доступні товари
                    </p>
                </div>

            </div>


            <div id="productsContainer"
                 class="product-grid">
            </div>

        </section>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <script src="/js/index.js"></script>

</body>
</html>
