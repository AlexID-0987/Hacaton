<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Product Assistant</title>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <div class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img class="brand-logo" src="https://allretail.ua/static/files/originals/2/0c/81ef94822fc56477bd777a767f47e0c2.svg" alt="Сільпо" />
            </div>
            <div style="color: var(--muted); font-size: 0.9rem;">AI помічник для покупок</div>
        </div>
    </div>

    <div class="page">
        <div class="promo">
            <div class="promo-card primary">
                <div class="promo-badge">Найкраща комбінація</div>
                <h2>Підібери продукти для сніданку до 350 грн</h2>
            </div>
            <div class="promo-card secondary">
                <div class="promo-badge">Свіжі</div>
                <label style="display:flex; flex-direction:column; gap:10px; font-size:0.9rem; font-weight:700; color: var(--text);">
                    Фрукти
                    <select id="fruitSelect" style="padding:12px 14px; border-radius:12px; border:1px solid rgba(148,163,184,0.25); background:#fff; font-size:1rem;">
                        <option value="">Оберіть фрукти</option>
                    </select>
                </label>
                <div class="mini-product-list" id="fruitList" style="margin-top:14px;"></div>
            </div>
            <div class="promo-card tertiary">
                <div class="promo-badge">Натуральні</div>
                <label style="display:flex; flex-direction:column; gap:10px; font-size:0.9rem; font-weight:700; color: var(--text);">
                    Овочі
                    <select id="vegetableSelect" style="padding:12px 14px; border-radius:12px; border:1px solid rgba(148,163,184,0.25); background:#fff; font-size:1rem;">
                        <option value="">Оберіть овочі</option>
                    </select>
                </label>
                <div class="mini-product-list" id="vegetableList" style="margin-top:14px;"></div>
            </div>
        </div>

        <div class="filter-panel">
            <label>
                Категорія
                <div class="select-wrap">
                    <select id="categoryFilter">
                        <option value="all">Усі товари</option>
                        <option value="Фрукти">Фрукти</option>
                        <option value="Овочі">Овочі</option>
                        <option value="Молочні">Молочні</option>
                        <option value="М'ясо">М'ясо</option>
                        <option value="Хлібобулочні">Хлібобулочні</option>
                        <option value="Напої">Напої</option>
                        <option value="Риба">Риба</option>
                    </select>
                </div>
            </label>
            <label>
                Тип прийому їжі
                <div class="select-wrap">
                    <select id="mealFilter">
                        <option value="all">Усі</option>
                        <option value="сніданок">Сніданок</option>
                        <option value="обід">Обід</option>
                        <option value="вечеря">Вечеря</option>
                        <option value="пікнік">Пікнік</option>
                    </select>
                </div>
            </label>
        </div>

        <div class="assistant-box">
            <div class="assistant-header">
                <h3>AI помічник</h3>
                <span class="chip">Онлайн</span>
            </div>

            <div class="input-wrap">
                <textarea id="message" aria-label="Запит до AI">Підбери продукти для сніданку до 350 грн</textarea>
                <button id="sendBtn" class="send-btn">Запитати</button>
            </div>

            <div class="result-box" id="resultBox"></div>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const resultBox = document.getElementById('resultBox');
        const categoryFilter = document.getElementById('categoryFilter');
        const mealFilter = document.getElementById('mealFilter');
        const fruitList = document.getElementById('fruitList');
        const vegetableList = document.getElementById('vegetableList');
        const fruitSelect = document.getElementById('fruitSelect');
        const vegetableSelect = document.getElementById('vegetableSelect');

        let allProducts = [];

        const fallbackImages = {
            'Яйця': 'https://vip.shuvar.com/pub/media/catalog/product/_/3/_3.jpg',
            'Огірки': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0Z6lZm5_1JDzXO894hjTQM5HR6Om1aCuvi3uGDg2XAg&s=10',
            'Буряк': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQxaCo9Jn3FkRJTsEEImyrWABwfO6SuFPye1h-XcgPG4Q&s=10',
            'Свинина': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTg2ZGLUx2iCJADwY9SRzuX_dwloM_QlQ4Tyx11mcwgoA&s=10',
            'Груша': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHopj8mv3y5LiGrCV-tufiPCsflDj78H73ZByP2x9A_w&s',
            'Куряче філе': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvDp1l1CoLJXCl4nV8QwJuCBQJPo_T78QU9_guUehG0g&s',
            'Куряче филе': 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvDp1l1CoLJXCl4nV8QwJuCBQJPo_T78QU9_guUehG0g&s'
        };

        const getProductImageUrl = (item) => {
            const name = item?.name?.trim() || item?.Name?.trim();
            return fallbackImages[name] || item?.imageUrl || item?.ImageUrl || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';
        };

        const renderSelectedCategory = (categoryName, selectElement, target) => {
            const selectedValue = selectElement.value;
            const items = allProducts.filter(product => (product.category || product.Category) === categoryName);
            const chosen = items.find(product => (product.name || product.Name) === selectedValue);

            if (!chosen) {
                target.innerHTML = '<div class="mini-product-item"><div class="name">Оберіть товар</div></div>';
                return;
            }

            target.innerHTML = `
                <div class="mini-product-item">
                    <img src="${getProductImageUrl(chosen)}" alt="${chosen.name || chosen.Name}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';" />
                    <div class="name">${chosen.name || chosen.Name}</div>
                    <div class="price">${chosen.price || chosen.Price} грн</div>
                </div>
            `;
        };

        const populateSelectOptions = () => {
            const fruits = allProducts.filter(product => (product.category || product.Category) === 'Фрукти');
            const vegetables = allProducts.filter(product => (product.category || product.Category) === 'Овочі');

            fruitSelect.innerHTML = '<option value="">Оберіть фрукти</option>' + fruits.map(product => `
                <option value="${product.name || product.Name}">${product.name || product.Name}</option>
            `).join('');

            vegetableSelect.innerHTML = '<option value="">Оберіть овочи</option>' + vegetables.map(product => `
                <option value="${product.name || product.Name}">${product.name || product.Name}</option>
            `).join('');

            fruitList.innerHTML = '<div class="mini-product-item"><div class="name">Оберіть фрукти</div></div>';
            vegetableList.innerHTML = '<div class="mini-product-item"><div class="name">Оберіть овочи</div></div>';

            categoryFilter.value = 'all';
            mealFilter.value = 'all';
            updateFilteredProducts();
        };

        const updateFilteredProducts = () => {
            const selectedCategory = categoryFilter.value;
            const selectedMeal = mealFilter.value;

            let filtered = [...allProducts];

            if (selectedCategory !== 'all') {
                filtered = filtered.filter(product => (product.category || product.Category) === selectedCategory);
            }

            if (selectedMeal !== 'all') {
                const mealMap = {
                    'сніданок': ['Яйця', 'Молоко', 'Хліб', 'Йогурт', 'Яблука', 'Банани', 'Сир', 'Огірки'],
                    'обід': ['Куряче філе', 'Огірки', 'Помідори', 'Картопля', 'Яблука', 'Сметана', 'Яловичина'],
                    'вечеря': ['Лосось', 'Куряче філе', 'Картопля', 'Капуста', 'Яблука', 'Груша', 'Молоко'],
                    'пікнік': ['Хліб', 'Банани', 'Яблука', 'Вода', 'Йогурт', 'Сир', 'Огірки', 'Яйця']
                };
                const names = mealMap[selectedMeal] || [];
                filtered = filtered.filter(product => names.includes(product.name || product.Name));
            }

            if (!filtered.length) {
                resultBox.innerHTML = '<h4>Товари не знайдено</h4><div class="meta">Спробуйте іншу категорію або тип прийому їжі.</div>';
                return;
            }

            if (selectedCategory === 'all' && selectedMeal === 'all') {
                resultBox.innerHTML = `
                    <h4>Усі товари</h4>
                    <div class="meta">Показано всі доступні товари</div>
                    <div class="product-grid">
                        ${filtered.map(item => `
                            <div class="product-card">
                                <img src="${getProductImageUrl(item)}" alt="${item.name || item.Name}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';" />
                                <div class="product-info">
                                    <div class="product-name">${item.name || item.Name}</div>
                                    <div class="product-details"><span>${item.category || item.Category}</span><strong>${item.price || item.Price} грн</strong></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            }

            resultBox.innerHTML = `
                <h4>${selectedCategory === 'all' ? 'Усі товари' : selectedCategory}</h4>
                <div class="meta">${selectedMeal === 'all' ? 'Показано всі товари' : `Тип прийому їжі: ${selectedMeal}`}</div>
                <div class="product-grid">
                    ${filtered.map(item => `
                        <div class="product-card">
                            <img src="${getProductImageUrl(item)}" alt="${item.name || item.Name}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';" />
                            <div class="product-info">
                                <div class="product-name">${item.name || item.Name}</div>
                                <div class="product-details"><span>${item.category || item.Category}</span><strong>${item.price || item.Price} грн</strong></div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        };

        const loadProducts = async () => {
            try {
                const response = await fetch('/api/assistant/products');
                if (!response.ok) {
                    throw new Error('Не вдалося завантажити товари');
                }

                allProducts = await response.json();
                populateSelectOptions();
            } catch (error) {
                resultBox.innerHTML = `<h4>Помилка завантаження товарів</h4><div class="meta">${error.message}</div>`;
            }
        };

        const updateAssistantMessageFromFilters = () => {
            const category = categoryFilter.value;
            const meal = mealFilter.value;

            if (category === 'all' && meal === 'all') {
                messageInput.value = 'Підбери продукти для сніданку до 350 грн';
                return;
            }

            const categoryText = category === 'all' ? 'продукти' : `продукти категорії ${category}`;
            const mealText = meal === 'all' ? 'для повсякденного меню' : `для ${meal}`;
            messageInput.value = `Підбери ${categoryText} ${mealText} до 350 грн`;
        };

        fruitSelect.addEventListener('change', () => renderSelectedCategory('Фрукти', fruitSelect, fruitList));
        vegetableSelect.addEventListener('change', () => renderSelectedCategory('Овочі', vegetableSelect, vegetableList));

        categoryFilter.addEventListener('change', () => {
            updateAssistantMessageFromFilters();
            updateFilteredProducts();
        });

        mealFilter.addEventListener('change', () => {
            updateAssistantMessageFromFilters();
            updateFilteredProducts();
        });

        sendBtn.addEventListener('click', async () => {
            const message = messageInput.value.trim();
            if (!message) {
                resultBox.innerHTML = '<h4>Спочатку введіть запит.</h4>';
                return;
            }

            resultBox.innerHTML = '<h4>Підбираю товари...</h4>';

            try {
                const response = await fetch('/api/assistant', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Помилка запиту');
                }

                const items = data.items || [];
                const total = data.totalPrice ?? 0;
                const budget = data.budget ?? 0;

                resultBox.innerHTML = `
                    <h4>${data.message}</h4>
                    <div class="meta">Бюджет: ${budget} грн</div>
                    <div class="meta">Загальна сума: ${total} грн</div>
                    <div class="product-grid">
                        ${items.map(item => `
                            <div class="product-card">
                                <img src="${getProductImageUrl(item)}" alt="${item.name}" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';" />
                                <div class="product-info">
                                    <div class="product-name">${item.name}</div>
                                    <div class="product-details"><span>× ${item.quantity}</span><strong>${item.total} грн</strong></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="total-row"><span>Разом</span><span>${total} грн</span></div>
                `;
            } catch (error) {
                resultBox.innerHTML = `<h4>Помилка</h4><div class="meta">${error.message}</div>`;
            }
        });

        loadProducts();
    </script>
</body>
</html>
